name: Apply CosteCoche consent v3

on:
  push:
    paths:
      - '.github/workflows/apply-consent-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject consent center across HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = '''\n  <!-- CosteCoche privacy bootstrap v3: sincroniza el consentimiento antes de cualquier cargador antiguo de Analytics -->\n  <script id="cc-consent-bootstrap">(()=>{const G="G-EZJ4866V6M",K="costecoche_consent_v3",L="costecoche_privacy_v2",MAX=31536000000;try{let c=localStorage.getItem(L),r=localStorage.getItem(K);if(r){const s=JSON.parse(r);if(s&&s.version===3&&typeof s.analytics==="boolean"&&Date.now()-Number(s.updatedAt)<=MAX){c=s.analytics?"accepted":"rejected";localStorage.setItem(L,c)}else{localStorage.removeItem(K);localStorage.removeItem(L);c=null}}window["ga-disable-"+G]=c!=="accepted"}catch(e){window["ga-disable-"+G]=true}})();</script>\n  <link rel="stylesheet" href="assets/consent.css">\n  <script src="assets/consent.js" defer></script>\n'''

          changed=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'):
                  continue
              text=p.read_text(encoding='utf-8')
              lower=text.lower()
              if '<html' not in lower or '</head>' not in lower:
                  continue
              # Las antiguas URLs de redirección no necesitan medición ni interfaz propia.
              if 'http-equiv="refresh"' in lower or "http-equiv='refresh'" in lower:
                  continue
              if 'assets/consent.js' not in text:
                  text=text.replace('</head>',bootstrap+'</head>',1)
              text=text.replace('Preferencias de analítica','Preferencias de privacidad')
              p.write_text(text,encoding='utf-8')
              changed.append(p.name)

          # Actualiza la explicación de cookies para reflejar la interfaz y los eventos actuales.
          p=Path('cookies.html')
          text=p.read_text(encoding='utf-8')
          old='''      <h2>Qué ocurre al entrar</h2>\n      <p>Si todavía no has elegido una preferencia, mostramos un aviso. Google Analytics no se carga hasta que pulses “Aceptar analítica”. Si eliges “Rechazar”, puedes seguir usando todas las calculadoras con normalidad.</p>\n      <h2>Almacenamiento local</h2>\n      <p>El sitio utiliza almacenamiento local del navegador para recordar si aceptaste o rechazaste la medición. Esta preferencia evita que el aviso vuelva a aparecer en cada visita.</p>\n      <h2>Google Analytics</h2>\n      <p>Cuando lo aceptas, Google Analytics puede utilizar tecnologías de almacenamiento y medición para generar estadísticas de audiencia. Puedes retirar tu decisión desde el enlace “Preferencias de privacidad” del pie de página.</p>'''
          new='''      <h2>Qué ocurre al entrar</h2>\n      <p>Si todavía no has elegido una preferencia, mostramos un panel con tres opciones: “Aceptar todas”, “Rechazar no necesarias” y “Configurar”. Las calculadoras funcionan en los tres casos.</p>\n      <h2>Categorías</h2>\n      <p><strong>Necesarias:</strong> se utiliza almacenamiento local para recordar tu elección de privacidad. Esta categoría permanece activa porque permite conservar la preferencia entre páginas y visitas.</p>\n      <p><strong>Analítica:</strong> es opcional. Google Analytics solo se activa desde CosteCoche cuando has permitido esta categoría. Puedes volver a desactivarla en cualquier momento desde “Preferencias de privacidad”.</p>\n      <p><strong>Publicidad:</strong> CosteCoche no utiliza actualmente cookies publicitarias. Si se incorpora publicidad en el futuro, el sistema de consentimiento tendrá que revisarse antes de activarla.</p>\n      <h2>Qué medimos cuando aceptas Analytics</h2>\n      <p>Además de las métricas habituales de audiencia de Google Analytics, CosteCoche registra eventos técnicos para saber qué herramientas resultan útiles: uso del botón de calcular o comparar, uso de una referencia de precio de España y navegación interna entre calculadoras. Nuestros eventos personalizados no envían a Google Analytics los números que introduces en los campos de las calculadoras.</p>\n      <h2>Cómo cambiar tu decisión</h2>\n      <p>El enlace “Preferencias de privacidad” del pie de página vuelve a abrir el panel mostrando tu elección actual. Si retiras Analytics, CosteCoche deja de enviar nuevos eventos y elimina, cuando es posible desde el navegador, las cookies de Analytics creadas en este dominio.</p>'''
          if old in text:
              text=text.replace(old,new,1)
          text=text.replace('Cambiar preferencias de privacidad','Abrir preferencias de privacidad')
          p.write_text(text,encoding='utf-8')

          # Ajusta la política de privacidad con la medición de eventos, sin afirmar cumplimiento legal total.
          p=Path('privacidad.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace(
            'CosteCoche utiliza Google Analytics únicamente cuando aceptas expresamente la medición de audiencia mediante el aviso de privacidad. Si rechazas esa opción, el script de Google Analytics no se carga desde este sitio.',
            'CosteCoche utiliza Google Analytics únicamente cuando aceptas expresamente la categoría de analítica en el panel de privacidad. Si la rechazas, CosteCoche no activa el cargador de Google Analytics para esa visita.'
          )
          text=text.replace(
            'Analytics puede procesar información técnica y de uso para generar estadísticas agregadas sobre visitas y navegación. La gestión y conservación de esos datos depende de la configuración de la propiedad de Google Analytics y de las políticas de Google.',
            'Analytics puede procesar información técnica y de uso para generar estadísticas agregadas sobre visitas y navegación. Si aceptas, también registramos eventos técnicos como el uso de una calculadora, el uso de una referencia de precio de España o un clic de navegación interna. Los eventos personalizados de CosteCoche no incluyen los números que introduces en los campos. La gestión y conservación de los datos de Analytics depende de la configuración de la propiedad y de las políticas de Google.'
          )
          text=text.replace(
            'Guardamos en el almacenamiento local del navegador tu decisión de aceptar o rechazar Analytics para no preguntártelo en cada página. Puedes cambiarla en cualquier momento desde “Preferencias de privacidad” en el pie de página.',
            'Guardamos en el almacenamiento local del navegador tu elección de privacidad, incluida la categoría de analítica, para no preguntártelo en cada página. Puedes cambiarla en cualquier momento desde “Preferencias de privacidad” en el pie de página.'
          )
          p.write_text(text,encoding='utf-8')

          # Añade acceso a preferencias en cualquier pie de página que aún no tenga el disparador.
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'):
                  continue
              text=p.read_text(encoding='utf-8')
              if 'assets/consent.js' not in text or 'data-privacy-settings' in text:
                  continue
              if '<div class="foot-links">' in text:
                  text=text.replace('</div><p>©', '<a href="#" data-privacy-settings>Preferencias de privacidad</a></div><p>©',1)
                  p.write_text(text,encoding='utf-8')
              elif '</footer>' in text:
                  text=text.replace('</footer>','<div style="text-align:center;margin:12px 0"><a href="#" data-privacy-settings>Preferencias de privacidad</a></div></footer>',1)
                  p.write_text(text,encoding='utf-8')

          print('HTML preparado:', len(changed), 'archivos')
          PY
      - name: Validate scripts and integration
        shell: bash
        run: |
          node --check assets/consent.js
          python3 - <<'PY'
          from pathlib import Path
          missing=[]
          for p in Path('.').glob('*.html'):
              if p.name.lower().startswith('google'):
                  continue
              text=p.read_text(encoding='utf-8')
              low=text.lower()
              if '<html' not in low or 'http-equiv="refresh"' in low or "http-equiv='refresh'" in low:
                  continue
              if 'assets/consent.js' not in text or 'assets/consent.css' not in text:
                  missing.append(p.name)
          if missing:
              raise SystemExit('Falta Consent v3 en: '+', '.join(missing))
          print('Consent v3 presente en todas las páginas activas')
          PY
      - name: Commit site changes and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-consent-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Privacidad: consentimiento granular y eventos GA4"
          git push origin HEAD:main
