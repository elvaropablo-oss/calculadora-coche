name: Integrate nearby fuel finder
on:
  push:
    paths:
      - '.github/workflows/link-nearby-fuel.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate new nearby finder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          # Homepage: add a prominent SEO/tool card if it is not already present.
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          if 'gasolineras-cerca-de-mi.html' not in t:
              marker='      <a class="seo-card" href="cuanto-gasto-gasolina-al-mes.html">'
              card='''      <a class="seo-card" href="gasolineras-cerca-de-mi.html">\n        <div class="seo-icon">📍</div>\n        <h3>Gasolineras baratas cerca de mí</h3>\n        <p>Usa tu ubicación bajo demanda para comparar precios oficiales y distancia.</p>\n        <span class="seo-link">Buscar gasolineras →</span>\n      </a>\n\n'''
              if marker in t:
                  t=t.replace(marker,card+marker,1)
              else:
                  t=t.replace('</main>',f'<section class="section"><div class="container"><div class="section-head"><div class="eyebrow">Precios en directo</div><h2>Busca gasolineras cercanas</h2></div><div class="seo-grid">{card}</div></div></section>\n</main>',1)
              p.write_text(t,encoding='utf-8')
          
          # Price page: add navigation/related access to the nearby finder.
          p=Path('precios-combustible-espana.html'); t=p.read_text(encoding='utf-8')
          if 'href="gasolineras-cerca-de-mi.html"' not in t:
              nav='<a href="cuanto-gasto-gasolina-al-mes.html">Gasolina al mes</a>'
              if nav in t:
                  t=t.replace(nav,'<a href="gasolineras-cerca-de-mi.html">Gasolineras cerca</a>'+nav,1)
              rel='<div class="related">'
              if rel in t:
                  t=t.replace(rel,rel+'<a href="gasolineras-cerca-de-mi.html"><strong>Gasolineras cerca de mí</strong><small>Precio y distancia usando tu ubicación solo al buscar.</small></a>',1)
              p.write_text(t,encoding='utf-8')
          
          # Privacy page: explain the optional location flow and external map tiles.
          p=Path('privacidad.html'); t=p.read_text(encoding='utf-8')
          if 'Ubicación para buscar gasolineras' not in t:
              marker='      <h2>Enlaces externos</h2>'
              block='''      <h2>Ubicación para buscar gasolineras</h2>\n      <p>La herramienta “Gasolineras cerca de mí” solicita la ubicación únicamente después de que pulses el botón de búsqueda y aceptes el permiso del navegador. CosteCoche usa esas coordenadas en tu dispositivo para calcular distancias y no las incluye en sus eventos personalizados de Google Analytics ni las guarda como preferencia.</p>\n      <p>Cuando se muestra el mapa interactivo se cargan la biblioteca Leaflet y teselas cartográficas de OpenStreetMap. Esos proveedores externos pueden recibir datos técnicos necesarios para servir sus recursos, como la dirección IP y las peticiones de mapa.</p>\n'''
              if marker in t: t=t.replace(marker,block+marker,1)
              p.write_text(t,encoding='utf-8')
          
          # Sitemap: publish the new indexable tool.
          p=Path('sitemap.xml'); t=p.read_text(encoding='utf-8')
          url='https://elvaropablo-oss.github.io/calculadora-coche/gasolineras-cerca-de-mi.html'
          if url not in t:
              t=t.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-09-10</lastmod></url>\n</urlset>')
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit integration and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/link-nearby-fuel.yml
          git add index.html precios-combustible-espana.html privacidad.html sitemap.xml
          git commit -m "UX: integrar precios por provincia y gasolineras cercanas"
          git push