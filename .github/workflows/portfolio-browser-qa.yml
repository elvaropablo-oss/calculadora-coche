name: Portfolio browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'qa/**'
      - 'playwright.config.mjs'
      - '.github/workflows/portfolio-browser-qa.yml'
      - 'assets/product-parity.js'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow recent Pages deployments to settle
        run: sleep 120
      - name: Install QA tools
        run: npm install --no-save @playwright/test@latest @axe-core/playwright@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright and axe
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow recent Pages deployments to settle
        run: sleep 120
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@latest chrome-launcher@latest
      - name: Audit home and representative tool for all ten sites
        run: node qa/lighthouse.mjs
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-lighthouse-results
          path: lighthouse-results
          if-no-files-found: ignore
          retention-days: 14
