name: Probe RIPREE export
on:
  push:
    paths:
      - '.github/workflows/probe-ripree.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect export page
        shell: bash
        run: |
          set -e
          URL='https://energia.serviciosmin.gob.es/Ripree/ExportarInstalaciones/Export'
          curl -L -sS -c cookies.txt -D headers.txt "$URL" -o page.html
          echo '=== SCRIPT BLOCK ==='
          sed -n '145,270p' page.html
