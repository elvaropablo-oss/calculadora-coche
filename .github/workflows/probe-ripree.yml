name: Probe RIPREE export
on:
  push:
    paths:
      - '.github/workflows/probe-ripree.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download public charging-point export
        shell: bash
        run: |
          set -e
          BASE='https://energia.serviciosmin.gob.es/Ripree'
          curl -L -sS -c cookies.txt "$BASE/ExportarInstalaciones/Export" -o page.html
          curl -L -sS -b cookies.txt -D postheaders.txt \
            -H 'Content-Type: application/json' \
            --data '{"soloConsolidado":true}' \
            "$BASE/ExportarInstalaciones/GenerarExcel" -o export.bin
          echo '=== POST HEADERS ==='
          sed -n '1,100p' postheaders.txt
          echo '=== FILE ==='
          file export.bin || true
          wc -c export.bin
          echo '=== FIRST BYTES/TEXT ==='
          python - <<'PY'
          from pathlib import Path
          b=Path('export.bin').read_bytes()
          print(b[:120])
          for enc in ('utf-8-sig','utf-16','cp1252','latin1'):
              try:
                  s=b.decode(enc)
                  print('ENC',enc)
                  print(s[:5000])
                  break
              except Exception:
                  pass
          PY
