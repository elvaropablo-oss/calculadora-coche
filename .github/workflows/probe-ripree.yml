name: Probe charging data
on:
  push:
    paths:
      - '.github/workflows/probe-ripree.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect MITECO OGC collections
        shell: bash
        run: |
          set -e
          URL='https://gis.miteco.gob.es/geoserver/ogc/features/v1/collections?f=application/json'
          curl --max-time 60 -L -sS "$URL" -o collections.json
          echo 'bytes:' $(wc -c < collections.json)
          python - <<'PY'
          import json,re
          d=json.load(open('collections.json',encoding='utf-8'))
          cols=d.get('collections',[])
          print('collections',len(cols))
          for c in cols:
              text=' '.join(str(c.get(k,'')) for k in ('id','title','description')).lower()
              if any(w in text for w in ('recarga','carga','electr','vehiculo','vehículo')):
                  print('MATCH',c.get('id'),'|',c.get('title'),'|',c.get('description','')[:300])
                  for l in c.get('links',[]):
                      if l.get('rel') in ('items','self','alternate'):
                          print('LINK',l)
          PY
