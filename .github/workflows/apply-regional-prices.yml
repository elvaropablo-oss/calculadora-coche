name: Apply regional fuel prices
on:
  push:
    paths:
      - '.github/workflows/apply-regional-prices.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply regional pricing integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          regional='<script src="assets/precios-regiones.js" defer></script>'
          national='<script src="assets/precios-espana.js" defer></script>'
          touched=[]

          for p in root.glob('*.html'):
              t=p.read_text(encoding='utf-8')
              old=t
              if 'assets/precios-espana.js' in t and 'assets/precios-regiones.js' not in t:
                  t=t.replace(national, national+'\n'+regional)
                  if t==old:
                      t=re.sub(r'(<script[^>]+src=["\']assets/precios-espana\.js["\'][^>]*></script>)', r'\1\n'+regional, t, count=1, flags=re.I)
              elif 'assets/precios-espana.js' not in t and '<label' in t and ('€/L' in t or '€/l' in t or 'Precio del combustible' in t):
                  t=t.replace('</body>', national+'\n'+regional+'\n</body>')
              if t!=old:
                  p.write_text(t,encoding='utf-8'); touched.append(p.name)

          p=root/'precios-combustible-espana.html'
          t=p.read_text(encoding='utf-8'); old=t
          replacements={
            '<title>Precio gasolina y diésel hoy en España | CosteCoche</title>':'<title>Precio gasolina por provincia y comunidad | CosteCoche</title>',
            'Consulta el precio mínimo, medio y máximo de gasolina 95 y diésel en España con datos oficiales, y referencias de coste de electricidad para coche.':'Consulta la media, mínimo y máximo de gasolina 95 y diésel en España, por comunidad autónoma y provincia, con datos oficiales actualizados.',
            'Precio gasolina y diésel hoy en España | CosteCoche':'Precio gasolina por provincia y comunidad | CosteCoche',
            'Mínimo, media y máximo de gasolina 95 y diésel calculados con datos oficiales de estaciones de servicio.':'Compara gasolina 95 y diésel por comunidad autónoma y provincia con datos oficiales de estaciones de servicio.',
            '/ Precios de combustible en España':'/ Precios de combustible por zona',
            'Datos de referencia · España':'Datos oficiales · España',
            '<h1>Precio de gasolina y diésel en España</h1>':'<h1>Precio de gasolina y diésel por comunidad y provincia</h1>',
            'Consulta una referencia nacional antes de hacer tus cálculos. CosteCoche obtiene los precios publicados por las estaciones de servicio y calcula mínimo, media, máximo y rango central.':'Compara el precio publicado en toda España con tu comunidad autónoma o provincia. CosteCoche calcula la media, los extremos y un rango central usando las estaciones de servicio que reportan un precio válido.',
            '<span class="pill">Sin registro</span>':'<span class="pill">Selección manual de zona</span>',
            '<small>Para evitar conclusiones engañosas</small><div class="hero-value">Media + rango</div><div>Además del mínimo y máximo mostramos el percentil 10–90, más útil para entender dónde se concentra la mayoría de precios publicados.</div>':'<small>Una referencia más cercana</small><div class="hero-value">España → CCAA → provincia</div><div>Selecciona tu zona y compárala con la media nacional antes de usar una calculadora.</div>',
            '<h2>Gasolina 95 y Gasóleo A</h2><p class="sub">Los datos se solicitan al servicio público del Ministerio cuando abres esta página. Si el servicio oficial no responde, no inventamos un valor.</p>':'<h2>Gasolina 95 y Gasóleo A por zona</h2><p class="sub">Elige primero una comunidad autónoma y, si quieres más precisión, una provincia. La API oficial del Ministerio permite consultar ambos niveles territoriales.</p>',
            '<article class="info"><h2>¿Qué precio pongo en la calculadora?</h2><p>Si conoces el precio de tu gasolinera habitual, úsalo. Si no, la media nacional es una buena referencia para una estimación inicial. En varias calculadoras de CosteCoche encontrarás el botón <strong>“Usar media de España”</strong>.</p><p><a href="cuanto-gasto-gasolina-al-mes.html">Calcular gasto mensual →</a></p></article>':'<article class="info"><h2>¿Qué zona conviene elegir?</h2><p>Si normalmente repostas cerca de casa, la provincia suele ser una referencia más útil que la media de toda España. Si te mueves mucho dentro de una comunidad, la media autonómica puede ser más representativa.</p><p>La zona se elige manualmente: <strong>CosteCoche no usa GPS</strong>. La selección se guarda en este navegador para que las calculadoras compatibles puedan ofrecerte esa media.</p></article>'
          }
          for a,b in replacements.items(): t=t.replace(a,b)
          if t!=old:
              p.write_text(t,encoding='utf-8'); touched.append(p.name)

          p=root/'cookies.html'; t=p.read_text(encoding='utf-8'); old=t
          t=t.replace('<p><strong>Necesarias:</strong> se utiliza almacenamiento local para recordar tu elección de privacidad. Esta categoría permanece activa porque permite conservar la preferencia entre páginas y visitas.</p>','<p><strong>Necesarias y preferencias locales:</strong> se utiliza almacenamiento local para recordar tu elección de privacidad y, si eliges una comunidad o provincia como referencia de combustible, esa selección. Estos datos permanecen en tu navegador y permiten conservar preferencias entre páginas y visitas.</p>')
          if t!=old: p.write_text(t,encoding='utf-8'); touched.append(p.name)

          p=root/'privacidad.html'; t=p.read_text(encoding='utf-8'); old=t
          t=t.replace('<p>Guardamos en el almacenamiento local del navegador tu elección de privacidad, incluida la categoría de analítica, para no preguntártelo en cada página. Puedes cambiarla en cualquier momento desde “Preferencias de privacidad” en el pie de página.</p>','<p>Guardamos en el almacenamiento local del navegador tu elección de privacidad, incluida la categoría de analítica, para no preguntártelo en cada página. También podemos guardar la comunidad autónoma o provincia que eliges manualmente como referencia de combustible. CosteCoche no usa GPS para obtener esa zona. Puedes cambiar las preferencias de privacidad en cualquier momento desde el pie de página y volver a España desde la página de precios.</p>')
          if t!=old: p.write_text(t,encoding='utf-8'); touched.append(p.name)

          print('Touched:', ', '.join(sorted(set(touched))))
          PY
      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' assets/precios-regiones.js 2>/dev/null || true
          git rm .github/workflows/apply-regional-prices.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Datos: precios por comunidad autónoma y provincia"
          git push
