name: Integrar buscador de recarga
on:
  push:
    paths:
      - '.github/workflows/integrar-recarga.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enlazar la nueva herramienta
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          changed=[]
          target='puntos-recarga-cerca-de-mi.html'

          def write(path,text,old):
              if text!=old:
                  path.write_text(text,encoding='utf-8'); changed.append(path.name)

          # Portada: sección visible de herramientas basadas en datos oficiales.
          p=root/'index.html'; t=p.read_text(encoding='utf-8'); old=t
          if 'id="movilidad-directo"' not in t:
              block='''\n<section class="section" id="movilidad-directo">\n  <div class="container">\n    <div class="section-head">\n      <div class="eyebrow">Datos y mapas</div>\n      <h2>Antes de repostar o recargar</h2>\n      <p class="sub">Consulta precios oficiales, encuentra gasolineras cercanas o localiza puntos de carga compatibles con tu coche eléctrico.</p>\n    </div>\n    <div class="seo-grid">\n      <a class="seo-card" href="precios-combustible-espana.html"><div class="seo-icon">📍</div><h3>Precios por provincia</h3><p>Compara gasolina 95 y diésel con datos oficiales.</p><span class="seo-link">Ver precios →</span></a>\n      <a class="seo-card" href="gasolineras-cerca-de-mi.html"><div class="seo-icon">⛽</div><h3>Gasolineras cerca de mí</h3><p>Busca las estaciones más baratas dentro del radio que elijas.</p><span class="seo-link">Buscar gasolineras →</span></a>\n      <a class="seo-card" href="puntos-recarga-cerca-de-mi.html"><div class="seo-icon">⚡</div><h3>Puntos de carga cerca de mí</h3><p>Filtra cargadores por distancia, potencia y conector.</p><span class="seo-link">Buscar cargadores →</span></a>\n    </div>\n  </div>\n</section>\n'''
              marker='<!-- NUEVA SECCIÓN: ENLACES A LAS 5 PÁGINAS -->'
              if marker in t:t=t.replace(marker,block+'\n'+marker,1)
              else:t=t.replace('</main>',block+'\n</main>',1)
          write(p,t,old)

          def add_related(filename,label,desc):
              p=root/filename
              if not p.exists(): return
              t=p.read_text(encoding='utf-8'); old=t
              if f'href="{target}"' not in t:
                  start=t.find('<div class="related">')
                  if start!=-1:
                      end=t.find('</div>',start)
                      if end!=-1:
                          a=f'<a href="{target}"><strong>{label}</strong><small>{desc}</small></a>'
                          t=t[:end]+a+t[end:]
                  else:
                      faq='<span class="eyebrow">Preguntas frecuentes</span>'
                      pos=t.find(faq)
                      if pos!=-1:
                          sec=f'<section class="section"><div class="container"><span class="eyebrow">Mapa de recarga</span><h2>Encuentra un cargador</h2><div class="related"><a href="{target}"><strong>{label}</strong><small>{desc}</small></a></div></div></section>\n'
                          secstart=t.rfind('<section',0,pos)
                          t=t[:secstart]+sec+t[secstart:]
              write(p,t,old)

          add_related('gasolineras-cerca-de-mi.html','Puntos de carga cerca de mí','Localiza cargadores por distancia, potencia y conector.')
          add_related('precios-combustible-espana.html','Puntos de carga cerca de mí','Mapa y filtros para coche eléctrico.')
          add_related('coste-viaje-coche-electrico.html','Puntos de carga cerca de mí','Encuentra cargadores públicos para tu ruta.')
          add_related('cuanto-cuesta-cargar-coche-electrico-en-casa.html','Puntos de carga públicos','Busca alternativas de recarga fuera de casa.')
          add_related('electrico-o-gasolina.html','Puntos de carga cerca de mí','Comprueba la infraestructura pública de tu zona.')

          # Navegación de las dos herramientas de datos.
          for filename in ('gasolineras-cerca-de-mi.html','precios-combustible-espana.html'):
              p=root/filename
              if not p.exists():continue
              t=p.read_text(encoding='utf-8');old=t
              nav_start=t.find('<nav aria-label="Navegación principal">')
              nav_end=t.find('</nav>',nav_start) if nav_start!=-1 else -1
              if nav_start!=-1 and nav_end!=-1 and target not in t[nav_start:nav_end]:
                  insert=f'<a href="{target}">Puntos de carga</a>'
                  t=t[:nav_end]+insert+t[nav_end:]
              write(p,t,old)

          # Privacidad: la misma regla de ubicación se aplica a ambas herramientas.
          p=root/'privacidad.html';t=p.read_text(encoding='utf-8');old=t
          t=t.replace('<h2>Ubicación para buscar gasolineras</h2>','<h2>Ubicación para buscar gasolineras y puntos de recarga</h2>')
          t=t.replace('La herramienta “Gasolineras cerca de mí” solicita la ubicación únicamente después de que pulses el botón de búsqueda y aceptes el permiso del navegador. CosteCoche usa esas coordenadas en tu dispositivo para calcular distancias y no las incluye en sus eventos personalizados de Google Analytics ni las guarda como preferencia.','Las herramientas “Gasolineras cerca de mí” y “Puntos de carga cerca de mí” solicitan la ubicación únicamente después de que pulses el botón de búsqueda y aceptes el permiso del navegador. CosteCoche usa esas coordenadas en tu dispositivo para calcular distancias y no las incluye en sus eventos personalizados de Google Analytics ni las guarda como preferencia.')
          write(p,t,old)

          # Sitemap.
          p=root/'sitemap.xml';t=p.read_text(encoding='utf-8');old=t
          url='https://elvaropablo-oss.github.io/calculadora-coche/puntos-recarga-cerca-de-mi.html'
          if url not in t:
              t=t.replace('</urlset>',f'  <url><loc>{url}</loc><lastmod>2026-09-10</lastmod></url>\n</urlset>')
          # páginas tocadas hoy
          t=re.sub(r'(<loc>https://elvaropablo-oss\.github\.io/calculadora-coche/</loc><lastmod>)[^<]+',r'\g<1>2026-09-10',t)
          write(p,t,old)
          print('Modificados:',', '.join(changed))
          PY
      - name: Publicar y limpiar workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/integrar-recarga.yml .github/workflows/probe-ripree.yml
          git add -A
          git commit -m "UX: integrar puntos de recarga cercanos"
          git pull --rebase origin main
          git push
