name: Activar buscador recarga v2
on:
  push:
    paths:
      - '.github/workflows/fix-recarga-html.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript y cambiar a la versión nueva
        shell: bash
        run: |
          node --check assets/puntos-recarga-v2.js
          python - <<'PY'
          from pathlib import Path
          p=Path('puntos-recarga-cerca-de-mi.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="assets/puntos-recarga.js" defer></script>'
          new='<script src="assets/puntos-recarga-v2.js?v=20260910b" defer></script>'
          if old not in s and new not in s:
              raise SystemExit('No se encontró la referencia al script de recarga')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/fix-recarga-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puntos-recarga-cerca-de-mi.html .github/workflows/fix-recarga-html.yml
          git commit -m "Fix: activar buscador de puntos de recarga v2"
          git push
