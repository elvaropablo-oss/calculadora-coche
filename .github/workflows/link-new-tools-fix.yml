name: Link new CosteCoche tools
on:
  push:
    paths:
      - '.github/workflows/link-new-tools-fix.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          text = Path('index.html').read_text(encoding='utf-8')
          cards = base64.b64decode('').decode('utf-8')
          needle = base64.b64decode('').decode('utf-8')
          if 'calculadora-consumo-real-coche.html' not in text:
              if needle not in text:
                  raise SystemExit('Homepage marker not found')
              Path('index.html').write_text(text.replace(needle, needle + cards, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/link-new-tools-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/link-new-tools-fix.yml
          git commit -m "SEO: enlazar cinco nuevas calculadoras desde la portada" || exit 0
          git push