name: Optimize CosteCoche home once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-optimize-once.yml'

permissions:
  contents: write

jobs:
  optimize-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')

          # 1) Externalize the large inline CSS. assets/home.css already contains
          # the same rules, so the visual design remains unchanged and the CSS
          # can now be cached independently by the browser.
          style_re = re.compile(r'\n\s*<style>\n.*?\n\s*</style>\n', re.S)
          if not style_re.search(html):
              raise SystemExit('Inline home style block not found')
          html = style_re.sub(
              '\n  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">\n'
              '  <link rel="stylesheet" href="assets/home.css">\n',
              html,
              count=1,
          )

          # 2) Improve social/search presentation without changing visible UI.
          if 'property="og:type"' not in html:
              social = '''  <meta property="og:type" content="website">\n  <meta property="og:locale" content="es_ES">\n  <meta property="og:title" content="CosteCoche | Calculadoras para saber cuánto cuesta tu coche">\n  <meta property="og:description" content="Calcula combustible, viajes, coste por kilómetro, coste total, mantenimiento y compara renting frente a comprar coche.">\n  <meta property="og:url" content="https://elvaropablo-oss.github.io/calculadora-coche/">\n  <meta name="twitter:card" content="summary">\n'''
              html = html.replace('  <meta name="theme-color" content="#2a6df2">\n', '  <meta name="theme-color" content="#2a6df2">\n' + social)

          if '"@type":"FAQPage"' not in html:
              faq_schema = '''\n  <script type="application/ld+json">\n  {\n    "@context":"https://schema.org",\n    "@type":"FAQPage",\n    "mainEntity":[\n      {"@type":"Question","name":"¿Los resultados son exactos?","acceptedAnswer":{"@type":"Answer","text":"Son estimaciones matemáticas basadas en los datos introducidos. El consumo, mantenimiento, precio del combustible y valor de reventa reales pueden variar."}},\n      {"@type":"Question","name":"¿Se guardan los números que introduzco?","acceptedAnswer":{"@type":"Answer","text":"Los cálculos se realizan directamente en el navegador y no requieren registro."}},\n      {"@type":"Question","name":"¿Para qué sirven las páginas específicas?","acceptedAnswer":{"@type":"Answer","text":"Cada página se centra en una pregunta concreta e incluye calculadora, explicación y ejemplos relacionados."}}\n    ]\n  }\n  </script>\n'''
              html = html.replace('</head>', faq_schema + '</head>', 1)

          html = html.replace('<nav class="nav-links">', '<nav class="nav-links" aria-label="Navegación principal">', 1)

          # 3) Give users a persistent way to reopen analytics preferences.
          if 'data-privacy-settings' not in html:
              html = html.replace(
                  '            <a href="aviso-legal.html">Aviso legal</a>',
                  '            <a href="aviso-legal.html">Aviso legal</a>\n            <a href="#" data-privacy-settings>Preferencias de analítica</a>',
                  1,
              )

          # 4) Externalize the home JS and unify consent with the rest of the site.
          script_re = re.compile(r'<script>\s*(const GA_ID=.*?)\s*</script>\s*</body>', re.S)
          match = script_re.search(html)
          if not match:
              raise SystemExit('Homepage calculator script not found')
          js = match.group(1).rstrip() + '\n'

          old = 'const PRIVACY_KEY="costecoche_analytics_choice_v1";'
          if old not in js:
              raise SystemExit('Old analytics privacy key not found')
          replacement = '''const PRIVACY_KEY="costecoche_privacy_v2";\n  const LEGACY_PRIVACY_KEY="costecoche_analytics_choice_v1";\n  if(!localStorage.getItem(PRIVACY_KEY)){\n    const legacyChoice=localStorage.getItem(LEGACY_PRIVACY_KEY);\n    if(legacyChoice){\n      localStorage.setItem(PRIVACY_KEY,legacyChoice);\n      localStorage.removeItem(LEGACY_PRIVACY_KEY);\n    }\n  }\n  const GA_DISABLED="ga-disable-"+GA_ID;\n  window[GA_DISABLED]=localStorage.getItem(PRIVACY_KEY)!=="accepted";'''
          js = js.replace(old, replacement, 1)

          js = js.replace(
              '    localStorage.setItem(PRIVACY_KEY,"accepted");\n    loadAnalytics();',
              '    localStorage.setItem(PRIVACY_KEY,"accepted");\n    window[GA_DISABLED]=false;\n    loadAnalytics();',
              1,
          )
          js = js.replace(
              '    localStorage.setItem(PRIVACY_KEY,"rejected");\n    banner.hidden=true;',
              '    localStorage.setItem(PRIVACY_KEY,"rejected");\n    window[GA_DISABLED]=true;\n    banner.hidden=true;',
              1,
          )

          privacy_handler = '''\n  document.querySelectorAll("[data-privacy-settings]").forEach(el=>{\n    el.addEventListener("click",event=>{\n      event.preventDefault();\n      localStorage.removeItem(PRIVACY_KEY);\n      window[GA_DISABLED]=true;\n      banner.hidden=false;\n    });\n  });\n'''
          marker = '  document.getElementById("year").textContent=new Date().getFullYear();'
          if marker not in js:
              raise SystemExit('Year marker not found')
          js = js.replace(marker, privacy_handler + '\n' + marker, 1)

          Path('assets/home.js').write_text(js, encoding='utf-8')
          html = script_re.sub('<script src="assets/home.js" defer></script>\n\n</body>', html, count=1)
          page.write_text(html, encoding='utf-8')

          # Remove this one-use workflow from the final repository state.
          Path('.github/workflows/home-optimize-once.yml').unlink()
          PY

      - name: Commit optimized homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimizar portada: rendimiento, metadatos y consentimiento"
          git push
